name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Reject committed secret regressions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' -E '(CLOUDFLARE_API_TOKEN|INGEST_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY)[[:space:]]*=[[:space:]]*[A-Za-z0-9_./+=-]{16,}' .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler@4.131.1 deploy --dry-run

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run sweep
      - run: npm run keys
      - run: "! npm run sweep -- --self-test"

  deploy:
    needs: [check, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx wrangler@4.131.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live site answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' https://sidereal.rlawoals0529.workers.dev/health)
            [ "$code" = "200" ] && echo "live, health 200" && exit 0
            echo "attempt $i: $code"; sleep 10
          done
          echo "the deploy uploaded but the site never answered"; exit 1
